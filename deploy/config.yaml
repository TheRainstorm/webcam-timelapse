global:
  interval: 30              # 抓帧间隔（秒）
  retention_days: 30        # 快照保留天数
  video_fps: 60             # 合成视频输出帧率
  video_speed_factor: 1.0   # 快进系数，实际快进倍数 = interval * video_fps * video_speed_factor
  video_time: "00:05"       # 每日合成触发时间
  watermark:
    enabled: true
    position: top-left # top-left / top-right / bottom-left / bottom-right
    font: fonts/NotoSansMono-Regular.ttf
    size: 48
    color: "white"
    bg_color: "rgba(0,0,0,128)"  # 半透明背景
    format: "%Y-%m-%d %H:%M:%S"

cameras:
  - name: "Front Door"
    snapshot_url: "http://192.168.1.10/snapshot"
    stream_url: "/go2rtc/webrtc.html?src=front-door"
    output_dir: "/data/front-door"
    interval: 30

  - name: "Garden"
    snapshot_url: "http://192.168.1.11/snapshot"
    output_dir: "/data/garden"
