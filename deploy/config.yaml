global:
  active: true              # 是否启用该默认相机抓拍与合成
  interval: 30              # 抓帧间隔（秒）
  retention_days: 30        # 快照保留天数
  video_fps: 60             # 合成视频输出帧率
  video_speed_factor: 1.0   # 快进系数，实际快进倍数 = interval * video_fps * video_speed_factor
  video_encoder: libx264    # libx264 / h264_vaapi / hevc_vaapi / h264_nvenc
  video_quality: 23         # 统一质量参数，越小越清晰
  vaapi_device: /dev/dri/renderD128
  video_time: "00:05"       # 每日合成触发时间
  daylight:
    enabled: false
    latitude: 31.2304
    longitude: 121.4737
    timezone: Asia/Shanghai
    torch_on_url:
    torch_off_url:
    disable_night_snapshots: false
  watermark:
    enabled: true
    position: top-left # top-left / top-right / bottom-left / bottom-right
    font: fonts/NotoSansMono-Regular.ttf
    size: 48
    color: "white"
    bg_color: "rgba(0,0,0,128)"  # 半透明背景
    format: "%Y-%m-%d %H:%M:%S"

cameras:
  - name: "Front Door"
    active: true
    snapshot_url: "http://192.168.1.10/snapshot"
    stream_url: "/go2rtc/webrtc.html?src=front-door"
    output_dir: "/data/front-door"
    interval: 30
    daylight:
      enabled: true
      torch_on_url: "http://192.168.35.126:8080/enabletorch"
      torch_off_url: "http://192.168.35.126:8080/disabletorch"

  - name: "Garden"
    active: true
    snapshot_url: "http://192.168.1.11/snapshot"
    output_dir: "/data/garden"
    daylight:
      enabled: true
      disable_night_snapshots: true
