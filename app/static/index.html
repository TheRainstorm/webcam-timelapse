<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webcam Timelapse</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>📷 Webcam Timelapse</h1>
  <span class="subtitle">多摄像头延时摄影系统</span>
</header>
<main>
  <div class="camera-grid" id="grid">
    <div class="empty">加载中...</div>
  </div>
</main>

<div class="modal-overlay" id="streamModal">
  <div class="modal">
    <span class="modal-close" onclick="closeStream()">✕</span>
    <div id="streamContent" class="stream-modal-content"></div>
  </div>
</div>

<script>
function escapeAttr(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function latestSnapshotUrl(cam) {
  if (!cam.latest_snapshot) return '';
  const path = cam.latest_snapshot
    .replace(/^snapshots\//, '')
    .split('/')
    .map(encodeURIComponent)
    .join('/');
  return `/api/cameras/${encodeURIComponent(cam.name)}/snapshots/${path}`;
}

function renderStreamEmbed(url) {
  const safeUrl = escapeAttr(url);
  if (isWebRtcStream(url)) {
    return `<iframe class="stream-frame" src="${safeUrl}" allow="autoplay; fullscreen; microphone; camera" allowfullscreen></iframe>`;
  }
  return `<video src="${safeUrl}" autoplay controls playsinline></video>`;
}

function isWebRtcStream(url) {
  try {
    const parsed = new URL(url, location.href);
    const path = parsed.pathname.toLowerCase();
    const query = parsed.search.toLowerCase();
    return path.includes('/webrtc') || query.includes('webrtc');
  } catch {
    return String(url).toLowerCase().includes('webrtc');
  }
}

function renderStreamPoster(snapshotUrl) {
  if (snapshotUrl) {
    return `
      <button class="stream-poster" type="button" onclick="playStreamFromPoster()">
        <img src="${escapeAttr(snapshotUrl)}" alt="">
        <span class="play-btn">▶</span>
      </button>`;
  }
  return '<button class="stream-poster stream-placeholder" type="button" onclick="playStreamFromPoster()">点击播放实时预览</button>';
}

function setCardOnlineState(name, online) {
  const card = document.querySelector(`.camera-card[data-name="${CSS.escape(name)}"]`);
  if (!card) return;
  const statusText = card.querySelector('[data-role="online-text"]');
  const dot = card.querySelector('[data-role="online-dot"]');
  card.classList.toggle('active', online);
  card.classList.toggle('inactive', !online);
  if (statusText) statusText.textContent = online ? '在线' : '离线';
  if (dot) {
    dot.classList.remove('active', 'inactive');
    dot.classList.add(online ? 'active' : 'inactive');
  }
}

function probeImageUrl(url, timeoutMs = 5000) {
  return new Promise(resolve => {
    if (!url) { resolve(false); return; }
    const img = new Image();
    const timer = setTimeout(() => done(false), timeoutMs);
    function done(ok) {
      clearTimeout(timer);
      img.onload = null;
      img.onerror = null;
      resolve(ok);
    }
    img.onload = () => done(true);
    img.onerror = () => done(false);
    img.src = `${url}${url.includes('?') ? '&' : '?'}_ts=${Date.now()}`;
  });
}

function probeFrameUrl(url, timeoutMs = 5000) {
  return new Promise(resolve => {
    if (!url) { resolve(null); return; }
    const frame = document.createElement('iframe');
    frame.style.display = 'none';
    const timer = setTimeout(() => done(false), timeoutMs);
    function done(ok) {
      clearTimeout(timer);
      frame.onload = null;
      frame.onerror = null;
      frame.remove();
      resolve(ok);
    }
    frame.onload = () => done(true);
    frame.onerror = () => done(false);
    frame.src = `${url}${url.includes('?') ? '&' : '?'}_ts=${Date.now()}`;
    document.body.appendChild(frame);
  });
}

async function probeCamera(cam) {
  const snapshotOk = await probeImageUrl(cam.snapshot_url);
  const streamOk = await probeFrameUrl(cam.stream_url);
  return snapshotOk && (streamOk !== false);
}

async function load() {
  const res = await fetch('/api/cameras');
  const cameras = await res.json();
  const grid = document.getElementById('grid');
  if (!cameras.length) { grid.innerHTML = '<div class="empty">暂无摄像头配置</div>'; return; }

  grid.innerHTML = cameras.map(cam => {
    const snapshotUrl = latestSnapshotUrl(cam);
    const thumb = snapshotUrl
      ? `<img src="${escapeAttr(snapshotUrl)}" onerror="this.style.display='none'">`
      : '';
    const playBtn = cam.stream_url ? `<div class="play-btn">▶</div>` : '';
    return `
    <div class="camera-card inactive ${cam.active ? '' : 'paused'}" data-name="${escapeAttr(cam.name)}">
      <div class="camera-thumb" data-stream-url="${escapeAttr(cam.stream_url || '')}" data-snapshot-url="${escapeAttr(snapshotUrl)}" onclick="openStreamFromThumb(this)">
        ${thumb}
        ${playBtn}
      </div>
      <div class="camera-info">
        <h2>${cam.name}</h2>
        <div class="camera-meta">
          <span>今日 ${cam.today_count} 帧</span>
          ${cam.stream_url ? '<span class="tag">实时流</span>' : ''}
        </div>
        <div class="camera-status-line">
          <span class="status-dot inactive ${cam.active ? '' : 'paused'}" data-role="online-dot"></span>
          <span data-role="online-text">检测中</span>
          <span>·</span>
          <span>服务状态 ${cam.active ? '运行中' : '已关闭'}</span>
        </div>
        <div class="camera-actions">
          <a href="/camera.html?name=${encodeURIComponent(cam.name)}" class="btn btn-primary">详情</a>
          <button class="btn" onclick="triggerCapture('${cam.name}', this)" ${cam.active ? '' : 'disabled'}>立即抓帧</button>
        </div>
      </div>
    </div>`;
  }).join('');

  await Promise.all(cameras.map(async cam => {
    const online = await probeCamera(cam);
    setCardOnlineState(cam.name, online);
  }));
}

let activeStreamUrl = '';

function openStreamFromThumb(el) {
  openStream(el.dataset.streamUrl || '', el.dataset.snapshotUrl || '');
}

function openStream(url, snapshotUrl) {
  if (!url) return;
  const modal = document.getElementById('streamModal');
  const content = document.getElementById('streamContent');
  activeStreamUrl = url;
  content.innerHTML = renderStreamPoster(snapshotUrl);
  modal.classList.add('open');
}

function playStreamFromPoster() {
  if (!activeStreamUrl) return;
  document.getElementById('streamContent').innerHTML = renderStreamEmbed(activeStreamUrl);
}

function closeStream() {
  document.getElementById('streamModal').classList.remove('open');
  document.getElementById('streamContent').innerHTML = '';
  activeStreamUrl = '';
}

async function triggerCapture(name, btn) {
  btn.disabled = true;
  btn.textContent = '抓取中...';
  try {
    const res = await fetch(`/api/cameras/${encodeURIComponent(name)}/trigger`, { method: 'POST' });
    if (res.ok) { btn.textContent = '✓ 成功'; setTimeout(() => { btn.textContent = '立即抓帧'; btn.disabled = false; load(); }, 1500); }
    else { btn.textContent = '失败'; setTimeout(() => { btn.textContent = '立即抓帧'; btn.disabled = false; }, 1500); }
  } catch { btn.textContent = '错误'; btn.disabled = false; }
}

document.getElementById('streamModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeStream(); });
load();
</script>
</body>
</html>
