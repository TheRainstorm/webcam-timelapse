<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摄像头详情</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>📷 Webcam Timelapse</h1>
  <span class="subtitle" id="camTitle">摄像头详情</span>
</header>
<main>
  <a href="/" class="back-link">← 返回总览</a>

  <div class="detail-grid">
    <!-- 左列：实时流 + 统计 -->
    <div>
      <div class="panel" style="margin-bottom:20px">
        <h3>实时预览</h3>
        <div class="stream-box" id="streamBox">
          <div class="stream-placeholder">无实时流配置</div>
        </div>
        <div class="preview-actions">
          <button class="btn" id="btnStream" onclick="toggleStream()" disabled>播放实时预览</button>
          <button class="btn btn-primary" id="btnCapture" onclick="triggerCapture()">立即抓帧</button>
          <button class="btn" id="btnCompose" onclick="triggerComposeDay()">合成选中日期视频</button>
          <button class="btn" id="btnComposeRange" onclick="triggerComposeRange()">合成选中区间视频</button>
          <button class="btn" id="btnComposeAll" onclick="triggerComposeAll()">合成全部日期视频</button>
        </div>
        <div class="compose-settings">
          <label>
            <span>输出帧率</span>
            <span class="combo-field">
              <input id="composeFps" type="text" inputmode="numeric" value="24">
              <select id="composeFpsPreset" onchange="applyFpsPreset()">
                <option value="">常见</option>
                <option value="24">24</option>
                <option value="30">30</option>
                <option value="60">60</option>
                <option value="90">90</option>
                <option value="120">120</option>
                <option value="144">144</option>
                <option value="160">160</option>
                <option value="165">165</option>
              </select>
            </span>
          </label>
          <label>
            <span>快进系数</span>
            <input id="composeFactor" type="number" min="0.1" max="1000" step="0.1" value="1.0">
          </label>
          <label>
            <span>编码器</span>
            <select id="composeEncoder">
              <option value="libx264">libx264</option>
              <option value="h264_vaapi">h264_vaapi</option>
              <option value="hevc_vaapi">hevc_vaapi</option>
              <option value="h264_nvenc">h264_nvenc</option>
            </select>
          </label>
          <label>
            <span>质量</span>
            <input id="composeQuality" type="number" min="0" max="51" step="1" value="23">
          </label>
          <label class="check-field">
            <input id="composeWatermark" type="checkbox" checked>
            <span>合成时添加水印</span>
          </label>
          <label>
            <span>水印位置</span>
            <select id="composeWatermarkPosition">
              <option value="top-left">左上角</option>
              <option value="top-right">右上角</option>
              <option value="bottom-left">左下角</option>
              <option value="bottom-right">右下角</option>
            </select>
          </label>
          <label>
            <span>水印大小</span>
            <input id="composeWatermarkSize" type="number" min="8" max="96" step="1" value="24">
          </label>
        </div>
        <div class="compose-estimate" id="composeEstimate">选择日期后显示预计视频信息</div>
      </div>

      <div class="panel">
        <h3>统计</h3>
        <div class="stats" id="stats">
          <div class="stat"><div class="val" id="statSnaps">-</div><div class="lbl">总快照</div></div>
          <div class="stat"><div class="val" id="statVideos">-</div><div class="lbl">视频数</div></div>
          <div class="stat"><div class="val" id="statDays">-</div><div class="lbl">记录天数</div></div>
        </div>
      </div>
    </div>

    <!-- 右列：快照浏览 + 视频列表 -->
    <div>
      <div class="panel" style="margin-bottom:20px">
        <h3>历史快照</h3>
        <div class="calendar-box">
          <div class="calendar-head">
            <button class="icon-btn" type="button" onclick="changeCalendarMonth(-1)">‹</button>
            <div class="calendar-pickers">
              <select id="calendarYear" onchange="changeCalendarPicker()"></select>
              <select id="calendarMonth" onchange="changeCalendarPicker()"></select>
            </div>
            <button class="icon-btn" type="button" onclick="changeCalendarMonth(1)">›</button>
          </div>
          <div class="calendar-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="history-toolbar">
          <div class="day-summary" id="daySummary">选择日期查看快照和视频</div>
          <button class="btn" id="btnSnapSort" type="button" onclick="toggleSnapSort()">快照：新到旧</button>
        </div>
        <div class="range-toolbar">
          <button class="btn" type="button" onclick="setRangeBoundary('start')">设为开始</button>
          <button class="btn" type="button" onclick="setRangeBoundary('end')">设为结束</button>
          <button class="btn" type="button" onclick="useSelectedWeekRange()">选中周</button>
          <button class="btn" type="button" onclick="useSelectedMonthRange()">选中月</button>
          <div class="range-summary" id="rangeSummary">区间：未设置</div>
        </div>
        <div class="snap-grid" id="snapGrid"><div class="empty">选择日期查看快照</div></div>
        <div class="pager" id="snapPager"></div>
      </div>

      <div class="panel">
        <h3>延时视频</h3>
        <div class="video-list" id="videoList"><div class="empty">暂无视频</div></div>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal()">✕</span>
    <div id="modalContent" style="margin-top:10px"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const camName = params.get('name') || '';
document.getElementById('camTitle').textContent = camName;
document.title = camName + ' — Webcam Timelapse';

let snapData = {};
let videoData = [];
let selectedDate = '';
let calendarMonth = '';
let snapPage = 1;
let snapSort = 'desc';
const snapsPerPage = 24;
let snapshotInterval = 60;
let rangeStartDate = '';
let rangeEndDate = '';
let streamUrl = '';
let streamSnapshotUrl = '';
let streamPlaying = false;
let modalType = '';
let modalSnapDate = '';
let modalSnapFrames = [];
let modalSnapIndex = -1;

function escapeAttr(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function renderStreamEmbed(url) {
  const safeUrl = escapeAttr(url);
  if (isWebRtcStream(url)) {
    return `<iframe class="stream-frame" src="${safeUrl}" allow="autoplay; fullscreen; microphone; camera" allowfullscreen></iframe>`;
  }
  return `<video src="${safeUrl}" controls playsinline></video>`;
}

function isWebRtcStream(url) {
  try {
    const parsed = new URL(url, location.href);
    const path = parsed.pathname.toLowerCase();
    const query = parsed.search.toLowerCase();
    return path.includes('/webrtc') || query.includes('webrtc');
  } catch {
    return String(url).toLowerCase().includes('webrtc');
  }
}

function latestSnapshotUrl(cam) {
  if (!cam.latest_snapshot) return '';
  const path = cam.latest_snapshot
    .replace(/^snapshots\//, '')
    .split('/')
    .map(encodeURIComponent)
    .join('/');
  return `/api/cameras/${encodeURIComponent(cam.name)}/snapshots/${path}`;
}

function renderStreamPoster() {
  if (streamSnapshotUrl) {
    return `
      <button class="stream-poster" type="button" onclick="toggleStream()">
        <img src="${escapeAttr(streamSnapshotUrl)}" alt="">
        <span class="play-btn">▶</span>
      </button>`;
  }
  return '<button class="stream-poster stream-placeholder" type="button" onclick="toggleStream()">点击播放实时预览</button>';
}

function formatMonth(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

function monthNumber(month) {
  return Number(month.split('-')[1]);
}

function dateKey(date) {
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')
  ].join('-');
}

function dateFromIso(value) {
  const [year, month, day] = value.split('-').map(Number);
  return new Date(year, month - 1, day);
}

function addDays(value, days) {
  const next = dateFromIso(value);
  next.setDate(next.getDate() + days);
  return dateKey(next);
}

function expandDateRange(startDate, endDate) {
  if (!startDate || !endDate) return [];
  const dates = [];
  let current = startDate;
  while (current <= endDate) {
    dates.push(current);
    current = addDays(current, 1);
  }
  return dates;
}

function weekRange(dateStr) {
  const current = dateFromIso(dateStr);
  const weekday = (current.getDay() + 6) % 7;
  current.setDate(current.getDate() - weekday);
  const start = dateKey(current);
  current.setDate(current.getDate() + 6);
  return [start, dateKey(current)];
}

function monthRange(dateStr) {
  const current = dateFromIso(dateStr);
  const start = `${dateStr.slice(0, 7)}-01`;
  const end = dateKey(new Date(current.getFullYear(), current.getMonth() + 1, 0));
  return [start, end];
}

function normalizedRange() {
  if (!rangeStartDate || !rangeEndDate) return null;
  return rangeStartDate <= rangeEndDate
    ? [rangeStartDate, rangeEndDate]
    : [rangeEndDate, rangeStartDate];
}

function updateRangeSummary() {
  const el = document.getElementById('rangeSummary');
  const range = normalizedRange();
  if (!range) {
    el.textContent = '区间：未设置';
    return;
  }
  const [start, end] = range;
  let frameCount = 0;
  expandDateRange(start, end).forEach(date => {
    frameCount += (snapData[date] || []).length;
  });
  el.textContent = `区间：${start} ~ ${end} · ${frameCount} 张快照`;
}

function hasSnapshot(date) {
  return (snapData[date] || []).length > 0;
}

function hasVideo(date) {
  return videoData.some(v => v.start_date <= date && date <= v.end_date);
}

function availableDates() {
  const dates = new Set(Object.keys(snapData));
  videoData.forEach(video => {
    expandDateRange(video.start_date, video.end_date).forEach(date => dates.add(date));
  });
  return Array.from(dates).sort();
}

function availableYears() {
  const years = availableDates().map(d => d.slice(0, 4));
  years.push(String(new Date().getFullYear()));
  return Array.from(new Set(years)).sort((a, b) => Number(b) - Number(a));
}

function renderCalendarPickers() {
  const [currentYear] = calendarMonth.split('-');
  const yearSelect = document.getElementById('calendarYear');
  const monthSelect = document.getElementById('calendarMonth');
  const years = availableYears();

  yearSelect.innerHTML = years.map(year =>
    `<option value="${year}" ${year === currentYear ? 'selected' : ''}>${year} 年</option>`
  ).join('');

  monthSelect.innerHTML = Array.from({ length: 12 }, (_, i) => {
    const value = String(i + 1).padStart(2, '0');
    const selected = i + 1 === monthNumber(calendarMonth) ? 'selected' : '';
    return `<option value="${value}" ${selected}>${i + 1} 月</option>`;
  }).join('');
}

function renderCalendar() {
  if (!calendarMonth) calendarMonth = formatMonth(new Date());

  renderCalendarPickers();
  const grid = document.getElementById('calendarGrid');
  const [year, month] = calendarMonth.split('-').map(Number);
  const first = new Date(year, month - 1, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month, 0).getDate();
  const cells = [];

  for (let i = 0; i < startOffset; i++) {
    cells.push('<div class="calendar-day muted"></div>');
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const current = `${calendarMonth}-${String(day).padStart(2, '0')}`;
    const flags = [
      hasSnapshot(current) || hasVideo(current) ? 'has-data' : '',
      current === selectedDate ? 'selected' : '',
      current === dateKey(new Date()) ? 'today' : ''
    ].filter(Boolean).join(' ');
    const dots = [
      hasSnapshot(current) ? '<span class="dot snap-dot"></span>' : '',
      hasVideo(current) ? '<span class="dot video-dot"></span>' : ''
    ].join('');
    cells.push(`
      <button class="calendar-day ${flags}" type="button" onclick="selectDate('${current}')">
        <span>${day}</span>
        <span class="day-dots">${dots}</span>
      </button>`);
  }

  grid.innerHTML = cells.join('');
}

function changeCalendarPicker() {
  const year = document.getElementById('calendarYear').value;
  const month = document.getElementById('calendarMonth').value;
  calendarMonth = `${year}-${month}`;
  selectMonthDate();
}

function selectMonthDate() {
  const dates = availableDates().filter(d => d.startsWith(`${calendarMonth}-`));
  selectedDate = dates[dates.length - 1] || `${calendarMonth}-01`;
  snapPage = 1;
  renderCurrentDay();
}

function changeCalendarMonth(delta) {
  if (!calendarMonth) calendarMonth = formatMonth(new Date());
  const [year, month] = calendarMonth.split('-').map(Number);
  calendarMonth = formatMonth(new Date(year, month - 1 + delta, 1));
  selectMonthDate();
}

function snapshotTime(filename) {
  const base = String(filename).replace(/\.[^.]+$/, '');
  const match = base.match(/(\d{2})[-_:.](\d{2})[-_:.](\d{2})$/);
  if (match) return `${match[1]}:${match[2]}:${match[3]}`;
  return base;
}

async function loadSnapshots() {
  const res = await fetch(`/api/cameras/${encodeURIComponent(camName)}/snapshots`);
  const data = await res.json();
  snapData = data.dates || {};

  const dates = Object.keys(snapData).sort().reverse();

  let total = 0;
  dates.forEach(d => total += snapData[d].length);
  document.getElementById('statSnaps').textContent = total;
  document.getElementById('statDays').textContent = dates.length;

  syncDefaultDate();
  renderCurrentDay();
}

function syncDefaultDate() {
  if (!selectedDate) {
    selectedDate = dateKey(new Date());
  }
  calendarMonth = selectedDate.slice(0, 7);
}

function selectDate(d) {
  selectedDate = d;
  snapPage = 1;
  calendarMonth = d.slice(0, 7);
  renderCurrentDay();
}

function renderCurrentDay() {
  renderCalendar();
  updateRangeSummary();
  renderSnapshots();
  renderVideos();
  updateComposeEstimate();
}

function currentSortedFrames(date) {
  return [...(snapData[date] || [])].sort((a, b) =>
    snapSort === 'desc' ? b.localeCompare(a) : a.localeCompare(b)
  );
}

function renderSnapshots() {
  const frames = currentSortedFrames(selectedDate);
  const grid = document.getElementById('snapGrid');
  const pager = document.getElementById('snapPager');
  const videos = videoData.filter(v => v.start_date <= selectedDate && selectedDate <= v.end_date);
  document.getElementById('daySummary').textContent =
    `${selectedDate} · ${frames.length} 张快照 · ${videos.length} 个视频`;
  document.getElementById('btnSnapSort').textContent =
    snapSort === 'desc' ? '快照：新到旧' : '快照：旧到新';

  if (!frames.length) {
    grid.innerHTML = '<div class="empty">这一天暂无快照</div>';
    pager.innerHTML = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(frames.length / snapsPerPage));
  snapPage = Math.min(Math.max(1, snapPage), totalPages);
  const start = (snapPage - 1) * snapsPerPage;
  const pageFrames = frames.slice(start, start + snapsPerPage);

  grid.innerHTML = pageFrames.map(f => `
    <div class="snap-thumb" data-date="${escapeAttr(selectedDate)}" data-file="${escapeAttr(f)}" title="${escapeAttr(snapshotTime(f))}" onclick="viewSnap(this.dataset.date, this.dataset.file)">
      <img src="/api/cameras/${encodeURIComponent(camName)}/snapshots/${selectedDate}/${encodeURIComponent(f)}" loading="lazy">
      <span class="snap-time">${escapeAttr(snapshotTime(f))}</span>
    </div>`).join('');

  pager.innerHTML = `
    <button class="btn" onclick="changeSnapPage(-1)" ${snapPage === 1 ? 'disabled' : ''}>上一页</button>
    <span>第</span>
    <input class="pager-input" id="snapPageInput" type="number" min="1" max="${totalPages}" value="${snapPage}" onkeydown="handleSnapPageInput(event, ${totalPages})">
    <span>/ ${totalPages} 页</span>
    <button class="btn" type="button" onclick="jumpToSnapPage(${totalPages})">跳转</button>
    <button class="btn" onclick="changeSnapPage(1)" ${snapPage === totalPages ? 'disabled' : ''}>下一页</button>
  `;
}

function changeSnapPage(delta) {
  snapPage += delta;
  renderSnapshots();
}

function jumpToSnapPage(totalPages) {
  const value = document.getElementById('snapPageInput')?.value;
  snapPage = clampNumber(value, 1, totalPages, snapPage);
  renderSnapshots();
}

function handleSnapPageInput(event, totalPages) {
  if (event.key === 'Enter') {
    event.preventDefault();
    jumpToSnapPage(totalPages);
  }
}

function toggleSnapSort() {
  snapSort = snapSort === 'desc' ? 'asc' : 'desc';
  snapPage = 1;
  renderSnapshots();
}

async function loadVideos() {
  const res = await fetch(`/api/cameras/${encodeURIComponent(camName)}/videos`);
  const data = await res.json();
  videoData = data.videos || [];
  document.getElementById('statVideos').textContent = videoData.length;
  syncDefaultDate();
  renderCurrentDay();
}

function renderVideos() {
  const list = document.getElementById('videoList');
  const scopeOrder = { day: 0, range: 1, week: 2, month: 3 };
  const videos = videoData
    .filter(v => v.start_date <= selectedDate && selectedDate <= v.end_date)
    .sort((a, b) =>
      b.end_date.localeCompare(a.end_date)
      || a.start_date.localeCompare(b.start_date)
      || (scopeOrder[a.scope] ?? 99) - (scopeOrder[b.scope] ?? 99)
    );
  if (!videos.length) { list.innerHTML = '<div class="empty">这一天及所属区间暂无延时视频</div>'; return; }
  list.innerHTML = videos.map(v => `
    <div class="video-item" id="vi-${escapeAttr(v.id)}">
      <span class="video-date">${escapeAttr(v.label || v.date)}</span>
      <span class="tag">${escapeAttr(videoScopeLabel(v.scope))}</span>
      <span class="video-size">${(v.size/1024/1024).toFixed(1)} MB</span>
      <button class="btn" data-filename="${escapeAttr(v.filename)}" onclick="playVideo(this.dataset.filename)">▶ 播放</button>
      <a class="btn" href="/api/cameras/${encodeURIComponent(camName)}/videos/${encodeURIComponent(v.filename)}" download>↓</a>
      <button class="btn btn-danger" onclick="deleteVideo('${escapeAttr(v.id)}')">删除</button>
    </div>`).join('');
}

function videoScopeLabel(scope) {
  return ({
    day: '当天',
    range: '区间',
    week: '周',
    month: '月'
  })[scope] || scope;
}

async function loadStream() {
  const res = await fetch('/api/cameras');
  const cameras = await res.json();
  const cam = cameras.find(c => c.name === camName);
  const btn = document.getElementById('btnStream');
  if (!cam) return;

  document.getElementById('composeFps').value = cam.video_fps || 60;
  snapshotInterval = cam.interval || 30;
  document.getElementById('composeFactor').value = cam.video_speed_factor || 1.0;
  document.getElementById('composeEncoder').value = cam.video_encoder || 'libx264';
  document.getElementById('composeQuality').value = cam.video_quality ?? 23;
  document.getElementById('composeWatermark').checked = cam.watermark?.enabled !== false;
  document.getElementById('composeWatermarkPosition').value = cam.watermark?.position || 'bottom-right';
  document.getElementById('composeWatermarkSize').value = cam.watermark?.size || 24;
  bindComposeEstimateInputs();
  updateComposeEstimate();

  if (cam.stream_url) {
    streamUrl = cam.stream_url;
    streamSnapshotUrl = latestSnapshotUrl(cam);
    btn.disabled = false;
    document.getElementById('streamBox').innerHTML = renderStreamPoster();
  }
}

function toggleStream() {
  if (!streamUrl) return;

  const box = document.getElementById('streamBox');
  const btn = document.getElementById('btnStream');
  streamPlaying = !streamPlaying;

  if (streamPlaying) {
    box.innerHTML = renderStreamEmbed(streamUrl);
    btn.textContent = '暂停实时预览';
  } else {
    box.innerHTML = renderStreamPoster();
    btn.textContent = '播放实时预览';
  }
}

function renderModalSnap() {
  const file = modalSnapFrames[modalSnapIndex];
  if (!file || !modalSnapDate) return;
  const navHint = modalSnapFrames.length > 1
    ? `<div class="modal-hint">← 上一张 · 下一张 →</div>`
    : '';
  document.getElementById('modalContent').innerHTML =
    `<img src="/api/cameras/${encodeURIComponent(camName)}/snapshots/${encodeURIComponent(modalSnapDate)}/${encodeURIComponent(file)}" style="max-width:80vw;max-height:75vh"><div class="modal-caption">${escapeAttr(modalSnapDate)} ${escapeAttr(snapshotTime(file))}</div>${navHint}`;
}

function viewSnap(date, file) {
  modalType = 'snapshot';
  modalSnapDate = date;
  modalSnapFrames = currentSortedFrames(date);
  modalSnapIndex = modalSnapFrames.indexOf(file);
  if (modalSnapIndex < 0) {
    modalSnapFrames = [file];
    modalSnapIndex = 0;
  }
  renderModalSnap();
  document.getElementById('modal').classList.add('open');
}

function playVideo(filename) {
  modalType = 'video';
  modalSnapDate = '';
  modalSnapFrames = [];
  modalSnapIndex = -1;
  document.getElementById('modalContent').innerHTML =
    `<video src="/api/cameras/${encodeURIComponent(camName)}/videos/${encodeURIComponent(filename)}" controls playsinline preload="metadata" style="max-width:80vw;max-height:70vh"></video>`;
  document.getElementById('modal').classList.add('open');
}

function stepModalSnap(delta) {
  if (modalType !== 'snapshot' || modalSnapFrames.length <= 1) return;
  modalSnapIndex = Math.min(
    modalSnapFrames.length - 1,
    Math.max(0, modalSnapIndex + delta),
  );
  renderModalSnap();
}

function closeModal() {
  modalType = '';
  modalSnapDate = '';
  modalSnapFrames = [];
  modalSnapIndex = -1;
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalContent').innerHTML = '';
}

async function triggerCapture() {
  const btn = document.getElementById('btnCapture');
  btn.disabled = true; btn.textContent = '抓取中...';
  const res = await fetch(`/api/cameras/${encodeURIComponent(camName)}/trigger`, { method: 'POST' });
  btn.textContent = res.ok ? '✓ 成功' : '失败';
  setTimeout(() => { btn.textContent = '立即抓帧'; btn.disabled = false; loadSnapshots(); }, 1500);
}

function clampNumber(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, Math.round(n)));
}

function clampFloat(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function composeFps() {
  return clampNumber(document.getElementById('composeFps').value, 1, 240, 30);
}

function composeFactor() {
  return clampFloat(document.getElementById('composeFactor').value, 0.1, 1000, 1);
}

function composeQuality() {
  return clampNumber(document.getElementById('composeQuality').value, 0, 51, 23);
}

function applyFpsPreset() {
  const preset = document.getElementById('composeFpsPreset');
  if (!preset.value) return;
  document.getElementById('composeFps').value = preset.value;
  updateComposeEstimate();
}

function composeSpeed() {
  return composeFps() * snapshotInterval * composeFactor();
}

function composeFrameCount(sourceCount, fps, speed) {
  if (!sourceCount) return 0;
  return Math.max(1, Math.round(sourceCount * snapshotInterval * fps / speed));
}

function formatDuration(seconds) {
  const total = Math.max(0, Math.round(seconds));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function updateComposeEstimate() {
  const el = document.getElementById('composeEstimate');
  if (!el) return;

  const range = normalizedRange();
  let sourceCount = (snapData[selectedDate] || []).length;
  let rangeLabel = `当天 ${selectedDate || '未选择'}`;
  if (range) {
    sourceCount = 0;
    expandDateRange(range[0], range[1]).forEach(date => {
      sourceCount += (snapData[date] || []).length;
    });
    rangeLabel = `区间 ${range[0]} ~ ${range[1]}`;
  }
  const fps = composeFps();
  const factor = composeFactor();
  const speed = composeSpeed();
  const encoder = document.getElementById('composeEncoder').value || 'libx264';
  const quality = composeQuality();
  const outputFrames = composeFrameCount(sourceCount, fps, speed);
  const duration = outputFrames ? outputFrames / fps : 0;
  const watermarkEnabled = document.getElementById('composeWatermark').checked;
  const position = document.getElementById('composeWatermarkPosition').selectedOptions[0]?.textContent || '-';
  const size = clampNumber(document.getElementById('composeWatermarkSize').value, 8, 96, 24);

  el.textContent = [
    rangeLabel,
    `原始 ${sourceCount} 张`,
    `输出 ${outputFrames} 帧`,
    `预计 ${formatDuration(duration)}`,
    `帧率 ${fps}`,
    `间隔 ${snapshotInterval}s`,
    `系数 ${factor.toFixed(1)}`,
    `快进 ${speed.toFixed(1)}x`,
    `编码 ${encoder}`,
    `质量 ${quality}（越小越清晰）`,
    watermarkEnabled ? `水印 ${position} / ${size}px` : '无水印'
  ].join(' · ');
}

function bindComposeEstimateInputs() {
  document.querySelectorAll('#composeFps, #composeFactor, #composeEncoder, #composeQuality, #composeWatermark, #composeWatermarkPosition, #composeWatermarkSize')
    .forEach(el => {
      if (el.dataset.boundEstimate) return;
      el.dataset.boundEstimate = '1';
      el.addEventListener('input', updateComposeEstimate);
      el.addEventListener('change', updateComposeEstimate);
    });
}

function composeQueryParams(targetDate) {
  const watermarkEnabled = document.getElementById('composeWatermark').checked;
  const params = new URLSearchParams({
    video_fps: String(composeFps()),
    speed_multiplier: String(composeSpeed()),
    video_encoder: document.getElementById('composeEncoder').value || 'libx264',
    video_quality: String(composeQuality()),
    watermark_enabled: String(watermarkEnabled),
    watermark_position: document.getElementById('composeWatermarkPosition').value,
    watermark_size: String(clampNumber(document.getElementById('composeWatermarkSize').value, 8, 96, 24))
  });
  if (targetDate) params.set('target_date', targetDate);
  return params.toString();
}

async function triggerComposeDay() {
  const btn = document.getElementById('btnCompose');
  const frames = snapData[selectedDate] || [];
  if (!frames.length) {
    btn.textContent = '无快照';
    setTimeout(() => { btn.textContent = '合成选中日期视频'; }, 1500);
    return;
  }

  btn.disabled = true;
  btn.textContent = `合成 ${selectedDate}...`;
  const params = new URLSearchParams(composeQueryParams(selectedDate));
  params.set('period', 'day');
  const res = await fetch(`/api/cameras/${encodeURIComponent(camName)}/compose?${params.toString()}`, { method: 'POST' });
  btn.textContent = res.ok ? '✓ 已覆盖' : '失败';
  setTimeout(() => {
    btn.textContent = '合成选中日期视频';
    btn.disabled = false;
    loadVideos();
  }, 2000);
}

async function triggerComposeRange() {
  const btn = document.getElementById('btnComposeRange');
  const range = normalizedRange();
  if (!range) {
    btn.textContent = '先设区间';
    setTimeout(() => { btn.textContent = '合成选中区间视频'; }, 1500);
    return;
  }

  let frameCount = 0;
  expandDateRange(range[0], range[1]).forEach(date => {
    frameCount += (snapData[date] || []).length;
  });
  if (!frameCount) {
    btn.textContent = '区间无快照';
    setTimeout(() => { btn.textContent = '合成选中区间视频'; }, 1500);
    return;
  }

  btn.disabled = true;
  btn.textContent = `合成 ${range[0]} ~ ${range[1]}...`;
  const params = new URLSearchParams(composeQueryParams(''));
  params.set('period', 'range');
  params.set('start_date', range[0]);
  params.set('end_date', range[1]);
  const res = await fetch(`/api/cameras/${encodeURIComponent(camName)}/compose?${params.toString()}`, { method: 'POST' });
  btn.textContent = res.ok ? '✓ 已覆盖' : '失败';
  setTimeout(() => {
    btn.textContent = '合成选中区间视频';
    btn.disabled = false;
    loadVideos();
  }, 2000);
}

async function triggerComposeAll() {
  const btn = document.getElementById('btnComposeAll');
  const dates = Object.keys(snapData).sort();
  if (!dates.length) {
    btn.textContent = '无快照';
    setTimeout(() => { btn.textContent = '合成全部日期视频'; }, 1500);
    return;
  }

  btn.disabled = true;
  let okCount = 0;
  for (let i = 0; i < dates.length; i++) {
    btn.textContent = `合成 ${i + 1}/${dates.length}`;
    const params = new URLSearchParams(composeQueryParams(dates[i]));
    params.set('period', 'day');
    const res = await fetch(`/api/cameras/${encodeURIComponent(camName)}/compose?${params.toString()}`, { method: 'POST' });
    if (res.ok) okCount++;
  }

  btn.textContent = `完成 ${okCount}/${dates.length}`;
  setTimeout(() => {
    btn.textContent = '合成全部日期视频';
    btn.disabled = false;
    loadVideos();
  }, 2000);
}

async function deleteVideo(videoId) {
  if (!confirm(`确认删除 ${videoId} 的视频？`)) return;
  const res = await fetch(`/api/cameras/${encodeURIComponent(camName)}/videos/${encodeURIComponent(videoId)}`, { method: 'DELETE' });
  if (res.ok) { loadVideos(); }
}

function setRangeBoundary(type) {
  if (!selectedDate) return;
  if (type === 'start') rangeStartDate = selectedDate;
  if (type === 'end') rangeEndDate = selectedDate;
  if (!rangeStartDate) rangeStartDate = selectedDate;
  if (!rangeEndDate) rangeEndDate = selectedDate;
  updateRangeSummary();
  updateComposeEstimate();
  renderVideos();
}

function useSelectedWeekRange() {
  if (!selectedDate) return;
  [rangeStartDate, rangeEndDate] = weekRange(selectedDate);
  updateRangeSummary();
  updateComposeEstimate();
  renderVideos();
}

function useSelectedMonthRange() {
  if (!selectedDate) return;
  [rangeStartDate, rangeEndDate] = monthRange(selectedDate);
  updateRangeSummary();
  updateComposeEstimate();
  renderVideos();
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  const tag = e.target?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target?.isContentEditable) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeModal();
    return;
  }
  if (modalType !== 'snapshot') return;
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    stepModalSnap(-1);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    stepModalSnap(1);
  }
});

loadStream();
loadSnapshots();
loadVideos();
</script>
